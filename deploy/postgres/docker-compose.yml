services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: transmigration
      POSTGRES_USER: transmigration
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "5432:5432"
    volumes:
      - transmigration_postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U transmigration -d transmigration
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  transmigration_postgres:
