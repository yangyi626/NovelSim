[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-transmigration"
version = "0.0.1"
description = "AI 快穿系统：把线性小说编译为可交互、可演化、可回放的世界。"
requires-python = ">=3.8"
dependencies = [
    "pydantic>=1.10,<2",
    "openai>=0.28,<1",
    "python-dotenv>=1.0,<2",
    "fastapi>=0.99,<0.100",
    "uvicorn>=0.29,<0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "httpx>=0.24,<0.28",
    "python-multipart>=0.0.9,<1",
    "pyarrow>=14,<18",
]
production = [
    "psycopg2-binary>=2.9,<3",
]
qdrant = [
    # 1.11.3 是支持本项目 Python 3.8 运行时的最后版本线。
    "qdrant-client==1.11.3",
]
training = [
    # 训练环境独立于 Python 3.8 游戏 Runtime；Parquet 用于批量切片与审计。
    "pyarrow>=14,<18",
]

[tool.setuptools]
packages = ["world_schema", "engine", "compiler", "web", "evaluation", "training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "llm: 真实调用 LLM 的测试 (默认跳过，用 -m llm 单独运行)",
    "postgres: 需要 PostgreSQL + pgvector 服务的存储契约测试",
    "qdrant: 需要真实 qdrant-client Local Mode 的契约测试",
]
addopts = "-m 'not llm and not postgres and not qdrant'"
